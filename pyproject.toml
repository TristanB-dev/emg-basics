[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-basics"
version = "0.1.0"
description = "EMG signal processing and gesture decoding basics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "scikit-learn", "neurokit2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]